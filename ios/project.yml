# XcodeGen spec — the single source of truth for the Xcode project.
# GymRat.xcodeproj is generated (`make generate`) and git-ignored, so there are
# never .pbxproj merge conflicts. Edit this file, not the project.
name: GymRat

options:
  bundleIdPrefix: com.nextlevel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  GymRatKit:
    path: Packages/GymRatKit

targets:
  GymRat:
    type: application
    platform: iOS
    sources:
      - path: GymRat
    dependencies:
      - package: GymRatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: GymRat/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymRat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  GymRatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymRatTests
    dependencies:
      - target: GymRat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests

  GymRatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GymRatUITests
    dependencies:
      - target: GymRat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests

schemes:
  GymRat:
    build:
      targets:
        GymRat: all
        GymRatTests: [test]
        GymRatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - GymRat
      targets:
        - name: GymRatTests
          parallelizable: true
        - name: GymRatUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
