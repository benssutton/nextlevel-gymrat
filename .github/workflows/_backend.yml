# Backend quality gates. Called from ci.yml (PRs / main) and nightly.yml.
name: Backend (reusable)

on:
  workflow_call:
    inputs:
      publish-image:
        description: Push the built image to GHCR
        type: boolean
        default: false
      run-stress:
        description: Also run the k6 stress test (soft gate)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Pyright
        run: pyright

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (known CVEs in requirements.txt)
        run: pip-audit -r requirements.txt --desc

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: python certs/generate_self_signed_cert.py
      # Real Postgres via testcontainers (Docker is
      # preinstalled on ubuntu runners). .coveragerc enforces fail_under.
      - name: pytest
        run: pytest tests/ -v --cov --cov-report=xml --cov-report=html --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo "## Backend coverage"; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/junit.xml
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            gymrat-backend:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Vulnerability scan (Grype — fail on critical with a fix available)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gymrat-backend:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: gymrat-backend:scan
          format: spdx-json
          artifact-name: backend-sbom.spdx.json
      - name: Log in to GHCR
        if: inputs.publish-image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: inputs.publish-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend

  performance:
    name: Performance (k6)
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start full stack
        run: docker compose up -d --build --wait
      - name: Build k6 image
        run: docker build -t perf-scripts ./tests/performance
      - name: Smoke (hard gate)
        run: docker run --rm --network gymrat-backend_default -e BASE_URL=https://app perf-scripts run /scripts/smoke.js | tee "$RUNNER_TEMP/k6-smoke.txt"
      - name: Load (hard gate)
        run: docker run --rm --network gymrat-backend_default -e BASE_URL=https://app perf-scripts run /scripts/load.js | tee "$RUNNER_TEMP/k6-load.txt"
      - name: Stress (soft gate)
        if: inputs.run-stress
        continue-on-error: true
        run: docker run --rm --network gymrat-backend_default -e BASE_URL=https://app -e TARGET_RPS=50 perf-scripts run /scripts/stress.js | tee "$RUNNER_TEMP/k6-stress.txt"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-results
          path: ${{ runner.temp }}/k6-*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down -v
