# Blocks PRs that introduce dependencies with known vulnerabilities or
# disallowed licenses. On a PRIVATE repository this needs GitHub Code Security
# (paid) — opt in with the repository variable ENABLE_CODE_SCANNING=true.
# (pip-audit in _backend.yml covers backend CVEs on every plan.)
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    if: vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
