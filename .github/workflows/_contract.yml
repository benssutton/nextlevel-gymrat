# Runs both clients' contract tests against the REAL backend: the Docker Compose
# stack is started over plain HTTP, then the Swift (GymRatKit) and Kotlin
# (android/core) API-client tests hit it. Catches drift between backend/schemas
# and the iOS or Android models.
name: API contract (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Swift + Kotlin clients ↔ live backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start backend (HTTP on :8000)
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.http.yml up -d --build --wait
      # Kotlin runs before Swift: the Swift container writes root-owned files under
      # ios/Packages/GymRatKit/.build, which setup-gradle's wrapper scan can't read.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Kotlin contract tests
        working-directory: android
        env:
          GYMRAT_API_BASE_URL: http://localhost:8000
        run: ./gradlew :core:test
      - name: Swift contract tests
        run: >
          docker run --rm --network host
          -e GYMRAT_API_BASE_URL=http://localhost:8000
          -v "$PWD/ios/Packages/GymRatKit:/pkg" -w /pkg
          swift:6.1 swift test
      - name: Backend logs
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.http.yml down -v
