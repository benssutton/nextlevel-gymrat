# CodeQL static analysis.
#
# Code scanning on a PRIVATE repository requires GitHub Code Security (paid).
# This workflow is therefore opt-in: set the repository variable
# ENABLE_CODE_SCANNING=true (Settings → Secrets and variables → Actions →
# Variables) once the feature is enabled. Until then every job is skipped.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 4 * * 1" # Mondays 04:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-linux:
    name: Analyze (${{ matrix.language }})
    if: vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # Swift needs a real build on macOS (10x minutes), so it runs on main and
  # weekly only — not on every PR.
  analyze-swift:
    name: Analyze (swift)
    if: vars.ENABLE_CODE_SCANNING == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && cd ios && xcodegen generate
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        working-directory: ios
        run: >
          xcodebuild build -project GymRat.xcodeproj -scheme GymRat
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift
