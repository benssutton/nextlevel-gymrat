# Manual full run (backend with k6 stress + API contract). The daily schedule is
# disabled while work on the project is on hold; to restore it, add back
#   schedule:
#     - cron: "17 3 * * *"
# under `on:`. It catches newly published CVEs and upstream image drift.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (full, with stress)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_backend.yml
    with:
      run-stress: true

  contract:
    name: API contract
    uses: ./.github/workflows/_contract.yml
