# Dependabot version + security updates (free on private repositories).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /backend/tests/performance]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /backend
    schedule: { interval: weekly }
